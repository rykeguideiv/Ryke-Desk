# Constrói o instalador do Windows e o publica numa Release, passando antes
# pelo SignPath Foundation para ser assinado quando as credenciais existem.
#
# Só o binário construído AQUI, no GitHub Actions, a partir deste repositório
# público, é assinado — é isso que o SignPath verifica.
#
# COMO DISPARA
#   Ao enviar uma tag v<versão> (ex.: git tag v1.0.19 && git push origin v1.0.19)
#   ou manualmente pela aba Actions ("Run workflow").
#
# POR QUE O INSTALADOR NÃO FICA NO REPOSITÓRIO
#   Ele passa de 100 MB, que é o limite RÍGIDO do GitHub por arquivo — um
#   `git push` com ele dentro é recusado. Nem o Git LFS resolveria bem: cada
#   versão nova somaria outros 100 MB ao histórico, para sempre. Release é o
#   lugar desenhado para isto — fica fora do histórico, aceita arquivos grandes
#   e é o endereço que o README já dá a quem vai baixar.
#
# SOBRE O APK DO ANDROID
#   O aplicativo de celular vive em `ryke-mobile/`, dentro deste repositório, e
#   é compilado aqui junto com o instalador — a mesma tag entrega os dois.
#
#   Ele é assinado com a chave de DEPURAÇÃO do Android, que é pública e vem com
#   o SDK. Isso basta para instalar pelo arquivo, e é o que permite compilá-lo
#   num repositório aberto: uma chave de release é um segredo, e segredo não
#   mora em repositório público. O custo é não poder publicar na Play Store com
#   este APK.
#
# ANTES DE A ASSINATURA FUNCIONAR (uma vez só, depois que o SignPath aprovar)
#   1. Em Settings → Secrets and variables → Actions, crie o segredo
#      SIGNPATH_API_TOKEN (o token da sua conta SignPath).
#   2. Na mesma tela, aba Variables, crie SIGNPATH_ORGANIZATION_ID com o id da
#      sua organização no SignPath.
#   3. Ajuste project-slug e signing-policy-slug abaixo para os nomes que o
#      SignPath criar para o seu projeto.
#   4. NA CONFIGURAÇÃO DE ARTEFATO DO SIGNPATH, mande assinar também os
#      arquivos .node de DENTRO do instalador. Ver o porquê logo abaixo — este
#      passo é fácil de esquecer e é o que decide se o programa funciona numa
#      máquina nova.
#
# POR QUE ASSINAR SÓ O .EXE NÃO BASTA
#
#   O Windows avalia cada arquivo no momento em que o carrega, e não só o
#   instalador. Os módulos nativos (.node) ficam desempacotados ao lado do
#   executável, e o `electron-builder` NÃO os assina.
#
#   Num Windows 11 recém-instalado, com o Smart App Control ligado, um .node
#   sem assinatura é BLOQUEADO. O `koffi` é a ponte para o SendInput: sem ele o
#   acesso remoto conecta, mostra a tela e não responde a teclado nem mouse.
#   Para quem instalou, isso parece problema de rede — não há nada no programa
#   que aponte a causa.
#
#   Foi medido durante o desenvolvimento: com o Smart App Control ligado, o
#   Windows bloqueia qualquer binário recém-compilado, até um "olá mundo" de
#   três linhas. Não existe lista de exceções; é tudo ou nada.
#
#   O passo "Conferir a assinatura dos módulos nativos", mais abaixo, avisa
#   quando isso está pendente. Depois que a assinatura estiver funcionando,
#   defina EXIGIR_ASSINATURA=1 nesse passo para ele passar a FALHAR em vez de
#   avisar — aí uma versão nesse estado não sai mais sem querer.
#
# Enquanto esses valores não existirem, a Release sai assim mesmo, com o
# instalador NÃO assinado e um aviso dizendo isso. Antes este workflow não
# publicava Release nenhuma sem o SignPath, e a tag terminava em silêncio — o
# instalador ficava só como artefato do Actions, que expira e que ninguém que
# vem baixar o programa sabe onde procurar.

name: Release (build + assinatura)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # necessário para criar a Release e anexar o instalador

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.subir.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir tipos e testes de unidade
        run: npm run typecheck && npm run test:unit

      # ── a captura nativa (C++) ──────────────────────────────────────────
      #
      # É o único pedaço do projeto que precisa de compilador: a Desktop
      # Duplication é COM sobre Direct3D 11, e isso não atravessa uma ponte
      # FFI. O runner `windows-latest` já traz Build Tools, Windows SDK e
      # Python, então aqui basta mandar compilar.
      #
      # Compilado contra o ABI do ELECTRON, e não o do Node: um módulo nativo
      # construído para o Node não carrega dentro do Electron, e o erro que
      # isso produz ("NODE_MODULE_VERSION ... requires ...") não diz de cara
      # que a causa foi compilar para o alvo errado.
      - name: Instalar dependências da captura nativa
        working-directory: ryke-sistema/nativo
        run: npm ci --ignore-scripts

      - name: Compilar a captura nativa para o Electron
        working-directory: ryke-sistema/nativo
        run: npm run build:electron

      - name: Guardar a captura nativa como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ryke-captura-nativa
          path: ryke-sistema/nativo/build/Release/*.node
          if-no-files-found: error

      - name: Construir o instalador
        run: npm run dist

      # Um aviso, não uma falha: enquanto o SignPath não estiver ligado, os
      # `.node` saem sem assinatura — e num Windows 11 recém-instalado o Smart
      # App Control os bloqueia, deixando a sessão sem teclado nem mouse. É o
      # tipo de defeito que chega como "conecta mas não responde", sem pista
      # nenhuma da causa, então ele precisa estar dito em algum lugar.
      - name: Conferir a assinatura dos módulos nativos
        shell: pwsh
        run: node build/conferir-assinatura-nativos.js

      - name: Guardar o instalador não assinado como artefato
        id: subir
        uses: actions/upload-artifact@v4
        with:
          name: ryke-desk-instalador
          path: release/RykeDesk-Setup-*.exe
          if-no-files-found: error

  assinar:
    needs: build
    runs-on: ubuntu-latest
    # Só tenta assinar quando as credenciais do SignPath já existem. Sem elas,
    # o job é pulado e quem publica é o `publicar` abaixo.
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - name: Enviar ao SignPath e aguardar a assinatura
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ryke-desk
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: assinado

      - name: Publicar o instalador ASSINADO na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: assinado/*.exe

  # ─────────────────────────── Android ───────────────────────────
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências do celular
        working-directory: ryke-mobile
        run: npm ci

      - name: Conferir tipos e testes de unidade do celular
        working-directory: ryke-mobile
        run: npm run typecheck && npm run test:unit

      - name: Compilar o APK
        working-directory: ryke-mobile
        run: |
          npm run build
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Dar ao APK um nome que diga o que ele é
        run: |
          mkdir -p apk
          VERSAO=$(node -p "require('./ryke-mobile/package.json').version")
          cp ryke-mobile/android/app/build/outputs/apk/debug/app-debug.apk "apk/RykeDesk-Mobile-$VERSAO.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ryke-desk-apk
          path: apk/*.apk
          if-no-files-found: error

  # Publica o instalador e o APK. Este job é a diferença entre uma tag que
  # entrega arquivos para o usuário baixar e uma tag que não produz nada
  # visível — que era o que acontecia enquanto o SignPath não estivesse
  # configurado.
  publicar:
    needs: [build, apk]
    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ryke-desk-instalador
          path: entrega

      - uses: actions/download-artifact@v4
        with:
          name: ryke-desk-apk
          path: entrega

      - uses: softprops/action-gh-release@v2
        with:
          files: entrega/*
          body: |
            ## Instalar

            **Windows:** baixe o `RykeDesk-Setup-*.exe` abaixo e execute. Atualizar é rodar o instalador de novo — ele fecha a versão aberta, remove a anterior e preserva número, senha e favoritos.

            **Android:** baixe o `RykeDesk-Mobile-*.apk` e abra no aparelho. Será preciso permitir a instalação de fontes desconhecidas — o aplicativo não está na Play Store.

            > ⚠️ **Este instalador ainda NÃO está assinado.** O Windows vai mostrar o aviso do SmartScreen — clique em *Mais informações* → *Executar assim mesmo*. A assinatura pelo [SignPath Foundation](https://signpath.org/) entra assim que o projeto for aprovado, e a partir dali o aviso desaparece.
