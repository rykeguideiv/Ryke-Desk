# Pilha completa do lado servidor do Ryke Desk.
#
#   caddy   — TLS automático; transforma ws:// em wss:// para o mundo
#   ryke     — o servidor de números e sinalização
#   coturn   — STUN + TURN; o TURN é o que salva as conexões em NAT simétrico
#              (4G/5G, redes corporativas), onde o P2P puro não fecha
#
# Antes de subir: copie .env.example para .env e preencha.
#
#   docker compose up -d

services:
  ryke:
    build: .
    restart: unless-stopped
    environment:
      RYKE_PORT: 8787
      RYKE_DATA: /data/devices.json
      # Numa VPS o farol de rede local não tem função e só faria ruído.
      RYKE_SEM_FAROL: "1"
      RYKE_TURN_URL: "turn:${RYKE_DOMINIO}:3478?transport=udp,turn:${RYKE_DOMINIO}:3478?transport=tcp"
      RYKE_TURN_USER: ${TURN_USUARIO}
      RYKE_TURN_PASS: ${TURN_SENHA}
    volumes:
      - ryke-dados:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      RYKE_DOMINIO: ${RYKE_DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - ryke

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --realm=${RYKE_DOMINIO}
      - --server-name=${RYKE_DOMINIO}
      - --lt-cred-mech
      - --user=${TURN_USUARIO}:${TURN_SENHA}
      # Faixa de portas para as mídias retransmitidas — libere-a no firewall.
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      # Fecha as portas de gerência e impede que o TURN seja usado para
      # alcançar a rede interna da própria VPS.
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255

volumes:
  ryke-dados:
  caddy-dados:
  caddy-config:
